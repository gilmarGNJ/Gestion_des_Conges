<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Congés</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gestion des Congés</h1>
        <div id="summary-table-container"></div>
        <div id="legend"></div>
        <div class="controls">
            <button id="save-data">Sauvegarder les données</button>
            <label for="load-data-input" class="button-like-label">Charger les données</label>
            <input type="file" id="load-data-input" accept=".json" style="display: none;">
        </div>
        <div id="calendar-container">
            <div class="calendar-header">
                <button id="prev-year">&lt;</button>
                <select id="year-select"></select>
                <button id="next-year">&gt;</button>
            </div>
            <div id="calendar"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
